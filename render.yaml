services:
  # 1. Flask Backend API (connected to Supabase PostgreSQL)
  - type: web
    name: nexafrica-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn 'run:app' --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Paste your Supabase Session Pooler URI in Render Dashboard
      - key: CORS_ORIGINS
        value: "*" # Or restrict to https://nexafrica-client.onrender.com

  # 2. React + Vite Frontend (Static Site)
  - type: web
    name: nexafrica-client
    runtime: static
    rootDir: client
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexafrica-api.onrender.com/api

